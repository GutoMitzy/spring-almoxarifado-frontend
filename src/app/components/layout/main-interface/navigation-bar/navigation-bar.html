<nav class="navigation" aria-label="Navegação principal">
	@for (section of sections; track section.label) {
		<button
			class="navigation-item"
			[class.navigation-item--active]="activeSection === section.label"
			type="button"
			(click)="selectSection(section.label, section.path)"
		>
			<span class="navigation-icon" aria-hidden="true">{{ section.icon }}</span>
			<span>{{ section.label }}</span>
			@if (section.badge) {
				<span class="navigation-badge">{{ section.badge }}</span>
			}
		</button>
	}
</nav>
