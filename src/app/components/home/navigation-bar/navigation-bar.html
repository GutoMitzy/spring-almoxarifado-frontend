<nav class="navigation" aria-label="Navegação principal">
	@for (item of items; track item.label) {
		<button
			class="navigation-item"
			[class.navigation-item--active]="activeSection === item.label"
			type="button"
			(click)="selectSection(item.label)"
		>
			<span class="navigation-icon" aria-hidden="true">{{ item.icon }}</span>
			<span>{{ item.label }}</span>
			@if (item.badge) {
				<span class="navigation-badge">{{ item.badge }}</span>
			}
		</button>
	}
</nav>
