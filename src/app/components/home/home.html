<div class="home-page">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">▤</div>
      <div><strong>Almoxarifado</strong><span>Controle de estoque</span></div>
    </div>
    <app-navigation-bar (sectionSelected)="selectSection($event)"></app-navigation-bar>
    <app-user-profile></app-user-profile>
  </aside>

  <main class="main-content">
    <app-header (searchChanged)="updateSearch($event)"></app-header>
    @if (activeSection === 'Estoque') {
      <div class="content-body">
        <app-general-statistics></app-general-statistics>
        <app-content-overview [searchTerm]="searchTerm"></app-content-overview>
      </div>
    } @else {
      <div class="section-placeholder"><h2>{{ activeSection }}</h2><p>Esta área estará disponível em breve.</p></div>
    }
  </main>
</div>
