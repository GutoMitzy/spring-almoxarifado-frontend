<label class="field" [for]="inputId">
  <div class="field-row">
    <span>{{ label }}</span>
    <a href="#" aria-label="Recuperar senha" (click)="onForgotPassword($event)">Esqueceu a senha?</a>
  </div>

  <div class="input-shell">
    <app-icon class="input-icon" name="lock" aria-hidden="true"></app-icon>

    <input
      [id]="inputId"
      [type]="visible ? 'text' : 'password'"
      [value]="value"
      (input)="onInput($event)"
      (blur)="onTouched()"
      [disabled]="disabled"
      aria-label="Senha"
      placeholder="*********"
    />

    <button type="button" class="toggle-password" (click)="toggleVisibility()">
      <app-icon [name]="visible ? 'eye-off' : 'eye'" aria-hidden="true"></app-icon>
    </button>
  </div>
</label>
