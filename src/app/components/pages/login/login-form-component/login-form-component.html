<form class="login-form" [formGroup]="loginForm" (ngSubmit)="submit()" autocomplete="on">
  <label class="field" for="usuario">
    <span>Usuário</span>
      <div class="input-shell">
        <app-icon name="user"></app-icon>  
      <input formControlName="usuario" type="text" placeholder="Insira seu usuário" />
    </div>
  </label>

  <app-password-input formControlName="senha"></app-password-input>
  <button type="submit" [disabled]="!loginForm.valid" class="submit-btn">Entrar no Sistema</button>
</form>
