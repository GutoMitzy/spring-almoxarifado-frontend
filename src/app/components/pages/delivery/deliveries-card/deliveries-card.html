<section class="deliveries-card" aria-labelledby="deliveries-title">
	<header class="deliveries-card__header">
		<div><h2 id="deliveries-title">Entregas</h2><p>Acompanhe os pedidos em trânsito e recebidos.</p></div>
		<span class="deliveries-count">{{ totalEntradas() }} Entregas</span>
	</header>
	<div class="deliveries-card__list">
		@for(entrada of entradas(); track entrada.id) {
			<app-delivery-info [entrada]="entrada" ></app-delivery-info>
		} @empty {
			<p class="empty-state">Nenhum item encontrado.</p>
		}
	</div>
</section>
