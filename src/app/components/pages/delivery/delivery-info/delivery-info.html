<article class="delivery-info">
	<div class="delivery-info__icon" aria-hidden="true"><span class="material-icons">{{ deliveryIcon }}</span></div>
	<div class="delivery-info__body"><strong>Pedido #{{ entrada.id }}</strong><span>Fornecedor {{ entrada.fornecedor }}</span></div>
	<div class="delivery-info__date"><span>Previsão</span><strong>{{ entrada.dataPrevisao }}</strong></div>
	<span [class]="'delivery-status delivery-status--' + deliveryStatusStyle">{{ entrada.status }}</span>
</article>
