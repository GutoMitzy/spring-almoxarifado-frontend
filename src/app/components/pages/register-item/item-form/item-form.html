<form class="item-form" aria-label="Cadastro de novo item">
	<div class="form-heading"><h2>Informações do Produto</h2><p>Insira as especificações técnicas para inclusão imediata no estoque online.</p></div>
	<div class="field-grid code-row"><label><span>Código do Item</span><input placeholder="Ex: PR-M6-50" /></label><label><span>Descrição do Item</span><input placeholder="Ex: Parafuso Sextavado Zincado M6 x 50mm" /></label></div>
	<div class="field-grid category-row"><label><span>Categoria</span><select><option>Fixadores</option></select></label><label><span>Unidade de Medida</span><select><option>Unidades</option></select></label></div>
	<div class="field-grid stock-row"><label><span>Quantidade Inicial</span><input placeholder="0" /></label><label><span>Local de Armazenamento</span><input placeholder="Ex: A-04" /></label><label><span>Status Inicial</span><select><option>Disponível</option></select></label></div>
	<div class="field-grid purchase-row"><label><span>Fornecedor Principal</span><input placeholder="Ex: Metalúrgica FixaTudo Ltda" /></label><label><span>Preço Unitário (R$)</span><input placeholder="R$ 0,00" /></label><label><span>Data de Entrada</span><input placeholder="DD/MM/AAAA" /></label></div>
	<label class="notes-field"><span>Observações / Notas do Produto</span><textarea placeholder="Digite observações complementares sobre lote, fragilidade ou detalhes do produto..."></textarea></label>
</form>
